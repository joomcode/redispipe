name: CI

on: [push]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        go: ["1.19", "1.20", "1.21", "1.22", "1.23", "1.24"]
        stage: [testredis, testconn, testcluster]
        exclude:
          # Cluster suite spawns a 7-node redis cluster and takes ~7 minutes per
          # matrix cell, while its behaviour does not depend on the go version.
          - {go: "1.20", stage: testcluster}
          - {go: "1.21", stage: testcluster}
          - {go: "1.22", stage: testcluster}
          - {go: "1.23", stage: testcluster}

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Cache go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache redis build
      uses: actions/cache@v4
      with:
        path: |
          /tmp/redis-server
        key: ${{ runner.os }}-redis-${{ hashFiles('Makefile') }}

    - name: Install redis
      run: make /tmp/redis-server/redis-server


    - name: Build
      run: make ${{ matrix.stage }}
